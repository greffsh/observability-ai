apiVersion: 1

deleteContactPoints:
  - orgId: 1
    uid: analyzer-webhook

contactPoints:
  - orgId: 1
    name: Analyzer webhook bearer
    receivers:
      - uid: analyzer-webhook-bearer
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://analyzer:8080/v1/webhooks/grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $GRAFANA_WEBHOOK_SECRET
