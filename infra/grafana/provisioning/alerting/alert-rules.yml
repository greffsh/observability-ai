apiVersion: 1

groups:
  - orgId: 1
    name: Checkout API synthetic alerts
    folder: Grafana AI PoC
    interval: 10s
    rules:
      - uid: checkout-failure-mode-enabled
        title: Checkout failure mode enabled
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: checkout_failure_mode{service="checkout-api", environment="local"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: Checkout failure mode is enabled
          description: The deterministic failure mode for checkout-api is active.
        labels:
          service: checkout-api
          environment: local
          severity: warning
        isPaused: false
