apiVersion: 1

deleteRules:
  - orgId: 1
    uid: connect-controlled-failure
  - orgId: 1
    uid: checkout-failure-mode-enabled

groups:
  - orgId: 1
    name: HTTP service alerts
    folder: Grafana AI PoC
    interval: 10s
    rules:
      - uid: http-server-errors
        title: HTTP server errors detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum by (service, environment) (increase(http_server_requests_total{outcome="failure"}[1m]))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: KeepLast
        execErrState: Error
        for: 0s
        annotations:
          summary: HTTP server errors detected for {{ $labels.service }}
          description: One or more organic HTTP 5xx responses were observed in the last minute.
        labels:
          incident_scope: http
          signal: http_errors
          severity: warning
        isPaused: false

  - orgId: 1
    name: Checkout API synthetic alerts
    folder: Grafana AI PoC
    interval: 10s
    rules:
      - uid: checkout-api-unavailable
        title: Checkout API unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: checkout_availability{service="checkout-api", environment="local"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: Checkout API is unavailable
          description: The controlled checkout-api availability signal is zero.
        labels:
          service: checkout-api
          environment: local
          incident_scope: http
          signal: availability
          severity: warning
        isPaused: false
