name: grafana-ai

services:
  checkout-api:
    build:
      context: ./services/checkout-api
    environment:
      PORT: 8081
      SERVICE_NAME: checkout-api
      ENVIRONMENT: local
    ports:
      - "${CHECKOUT_API_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  analyzer:
    build:
      context: ./services/analyzer
    environment:
      PORT: 8080
      SERVICE_NAME: analyzer
      ENVIRONMENT: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-analyzer}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-grafana_ai}
      GRAFANA_WEBHOOK_SECRET: ${GRAFANA_WEBHOOK_SECRET:-change-me-webhook}
      ANALYZER_OPERATOR_TOKEN: ${ANALYZER_OPERATOR_TOKEN:-change-me-operator}
      ANALYZER_OPERATOR_ID: ${ANALYZER_OPERATOR_ID:-local-operator}
      ANALYZER_PUBLIC_BASE_URL: http://localhost:${ANALYZER_PORT:-8080}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_PUBLIC_URL: http://localhost:${PROMETHEUS_PORT:-9090}
      LOKI_URL: http://loki:3100
      LOKI_PUBLIC_URL: http://localhost:${LOKI_PORT:-3100}
    ports:
      - "${ANALYZER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grafana_ai}
      POSTGRES_USER: ${POSTGRES_USER:-analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-analyzer}" -d "${POSTGRES_DB:-grafana_ai}"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:9090/-/ready
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -verify-config=true
        - -config.file=/etc/loki/loki.yml
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/alloy
        - --version
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_WEBHOOK_SECRET: ${GRAFANA_WEBHOOK_SECRET:-change-me-webhook}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      analyzer:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  postgres-data:
  prometheus-data:
